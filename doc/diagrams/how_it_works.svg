<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 500" width="1660" height="500" role="img" aria-label="How stability_sdk sends a request"><title>How stability_sdk sends a request</title><defs><marker id="a0175C2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0175C2"/></marker><marker id="a5F6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker></defs><rect width="1660" height="500" fill="#fff"/><rect x="20" y="30" width="390" height="400" rx="20" fill="#F7F8F9" stroke="#E3E3E6" stroke-width="1.5"/><text x="42" y="62" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#0175C2">YOUR CODE</text><rect x="430" y="30" width="390" height="400" rx="20" fill="#F7F8F9" stroke="#E3E3E6" stroke-width="1.5"/><text x="452" y="62" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#7C3AED">STABILITY_SDK</text><rect x="840" y="30" width="390" height="400" rx="20" fill="#F7F8F9" stroke="#E3E3E6" stroke-width="1.5"/><text x="862" y="62" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#188038">OVER HTTP</text><rect x="1250" y="30" width="390" height="400" rx="20" fill="#F7F8F9" stroke="#E3E3E6" stroke-width="1.5"/><text x="1272" y="62" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#E37400">SERVERS</text><rect x="40" y="90" width="350" height="96" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="40" y="100" width="5" height="76" rx="2.5" fill="#0175C2"/><text x="62" y="124" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Flutter app or Dart server</text><text x="62" y="147" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Calls one method per service</text><text x="62" y="172" font-family="'Google Sans Code', ui-monospace, monospace" font-size="13" fill="#5F6368">stability.generate.core(...)</text><rect x="40" y="290" width="350" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="40" y="300" width="5" height="52" rx="2.5" fill="#0175C2"/><text x="62" y="324" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">GeneratedImage</text><text x="62" y="347" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">bytes, mimeType, seed, finishReason</text><rect x="450" y="90" width="350" height="96" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="450" y="100" width="5" height="76" rx="2.5" fill="#7C3AED"/><text x="472" y="124" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">StabilityClient</text><text x="472" y="147" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">generate, upscale, edit, control</text><text x="472" y="172" font-family="'Google Sans Code', ui-monospace, monospace" font-size="13" fill="#5F6368">results.wait(generation)</text><rect x="450" y="290" width="350" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="450" y="300" width="5" height="52" rx="2.5" fill="#7C3AED"/><text x="472" y="324" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Checks inputs first</text><text x="472" y="347" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Bad values fail before any request</text><rect x="860" y="90" width="350" height="96" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="860" y="100" width="5" height="76" rx="2.5" fill="#188038"/><text x="882" y="124" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Multipart POST</text><text x="882" y="147" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">accept: image/*</text><text x="882" y="172" font-family="'Google Sans Code', ui-monospace, monospace" font-size="13" fill="#5F6368">authorization: Bearer &lt;key&gt;</text><rect x="860" y="290" width="350" height="96" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="860" y="300" width="5" height="76" rx="2.5" fill="#188038"/><text x="882" y="324" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Async results</text><text x="882" y="347" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">202 while running, then the image</text><text x="882" y="372" font-family="'Google Sans Code', ui-monospace, monospace" font-size="13" fill="#5F6368">GET /v2beta/results/{id}</text><rect x="1270" y="90" width="350" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="1270" y="100" width="5" height="52" rx="2.5" fill="#E37400"/><text x="1292" y="124" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Stability AI REST API</text><text x="1292" y="147" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">api.stability.ai/v2beta</text><rect x="1270" y="290" width="350" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="1270" y="300" width="5" height="52" rx="2.5" fill="#E37400"/><text x="1292" y="324" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Your proxy, optional</text><text x="1292" y="347" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Holds the key. Set baseUrl to it.</text><path d="M390 126 L450 126" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#a5F6368)"/><path d="M800 126 L860 126" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#a5F6368)"/><path d="M1210 126 L1270 126" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#a5F6368)"/><path d="M1445.0 162 L1445.0 250 L215.0 250 L215.0 290" fill="none" stroke="#0175C2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a0175C2)"/><text x="835.0" y="242" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="12.5" fill="#0175C2">image bytes, seed and finish reason, or a typed error</text><text x="24" y="472" text-anchor="start" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="15" fill="#5F6368">Keep the API key on a server you control. Anyone with your app can read a key inside it.</text></svg>