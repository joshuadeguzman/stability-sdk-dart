name: stability_sdk
description: A Dart client for the Stability AI REST API. Generate, edit, upscale and control images with Stable Image and Stable Diffusion 3.5.
version: 0.2.0
homepage: https://github.com/joshuadeguzman/stability-sdk-dart
repository: https://github.com/joshuadeguzman/stability-sdk-dart
issue_tracker: https://github.com/joshuadeguzman/stability-sdk-dart/issues
topics:
  - stability-ai
  - stable-diffusion
  - image-generation
  - ai
  - api

screenshots:
  - description: How stability_sdk sends a request.
    path: screenshots/how_it_works.png
  - description: The example app in demo mode on iOS and Android, showing a saved sample.
    path: screenshots/example_generate.png

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
